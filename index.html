<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

<title>Social App Home</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

:root{
    --blue:#1877f2;
    --bg:#f0f2f5;
    --white:#fff;
    --text:#050505;
    --muted:#65676b;
    --line:#dddfe2;
    --input:#f0f2f5;
    --red:#e41e3f;
    --green:#31a24c;
}

body{
    background:var(--bg);
    color:var(--text);
    font-family:
        Arial,
        "Noto Sans Bengali",
        "Noto Sans",
        sans-serif;
}

button{
    font:inherit;
    border:0;
    background:none;
    cursor:pointer;
}

svg{
    display:block;
}

.app{
    min-height:100vh;
}


/* =====================================================
   TOP HEADER
===================================================== */

.header{
    background:#fff;
    position:sticky;
    top:0;
    z-index:1000;
    border-bottom:1px solid var(--line);
}

.header-row{
    height:64px;
    display:flex;
    align-items:center;
    padding:7px 12px;
    gap:10px;
}

.logo{
    color:var(--blue);
    font-size:34px;
    font-weight:800;
    letter-spacing:-2px;
    flex:1;
}

.top-actions{
    display:flex;
    gap:8px;
}

.round{
    width:44px;
    height:44px;
    border-radius:50%;
    background:#e4e6eb;

    display:flex;
    align-items:center;
    justify-content:center;
}

.round svg{
    width:25px;
    height:25px;
}


/* =====================================================
   MAIN NAVIGATION
===================================================== */

.main-nav{
    height:55px;
    background:#fff;

    display:grid;
    grid-template-columns:
        repeat(6,1fr);
}

.nav{
    position:relative;
    height:55px;

    display:flex;
    align-items:center;
    justify-content:center;

    color:#65676b;
}

.nav svg{
    width:29px;
    height:29px;
}

.nav.active{
    color:var(--blue);
}

.nav.active::after{
    content:"";

    position:absolute;
    left:12%;
    right:12%;
    bottom:0;

    height:3px;

    background:var(--blue);

    border-radius:
        4px 4px 0 0;
}

.badge{
    position:absolute;

    top:1px;
    right:12%;

    min-width:22px;
    height:22px;

    padding:0 5px;

    border:2px solid #fff;
    border-radius:20px;

    background:var(--red);
    color:#fff;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:10px;
    font-weight:bold;
}


/* =====================================================
   CONTENT
===================================================== */

.content{
    width:100%;
    max-width:760px;
    margin:auto;
}


/* =====================================================
   STATUS COMPOSER
===================================================== */

.composer{
    background:#fff;

    padding:10px 12px;

    border-bottom:
        1px solid var(--line);
}

.composer-row{
    min-height:58px;

    display:flex;
    align-items:center;

    gap:9px;
}

.avatar{
    width:48px;
    height:48px;

    min-width:48px;

    border-radius:50%;

    background:#e4e6eb;

    display:flex;
    align-items:center;
    justify-content:center;

    color:#777;

    position:relative;
}

.avatar svg{
    width:28px;
    height:28px;
}

.online{
    position:absolute;

    width:14px;
    height:14px;

    right:0;
    bottom:0;

    background:var(--green);

    border:
        2px solid #fff;

    border-radius:50%;
}

.status{
    height:48px;

    flex:1;

    min-width:0;

    background:var(--input);

    border-radius:26px;

    padding:0 17px;

    display:flex;
    align-items:center;

    font-size:16px;

    white-space:nowrap;
    overflow:hidden;
}

.photo{
    width:48px;
    min-width:48px;

    color:#45bd62;

    text-align:center;

    font-size:11px;
    font-weight:bold;
}

.photo svg{
    width:28px;
    height:28px;

    margin:auto;
}


/* =====================================================
   STORIES
===================================================== */

.stories{
    background:#fff;

    padding:
        10px 0
        13px;

    border-bottom:
        1px solid var(--line);
}

.stories-title{
    font-size:17px;
    font-weight:700;

    padding:
        0 13px
        9px;
}

.story-scroll{
    display:flex;

    gap:8px;

    overflow-x:auto;

    padding:
        0 12px;

    scrollbar-width:none;
}

.story-scroll::-webkit-scrollbar{
    display:none;
}

.story{
    position:relative;

    width:110px;
    min-width:110px;

    height:182px;

    border-radius:12px;

    overflow:hidden;

    background:
        linear-gradient(
            145deg,
            #777,
            #222
        );

    border:
        1px solid #ddd;
}

.story-bg{
    position:absolute;

    inset:0;

    background:
        linear-gradient(
            145deg,
            #eee,
            #aaa,
            #555
        );
}

.story:nth-child(2)
.story-bg{
    background:
        linear-gradient(
            145deg,
            #305e8a,
            #bd8080,
            #242424
        );
}

.story:nth-child(3)
.story-bg{
    background:
        linear-gradient(
            145deg,
            #668e55,
            #d1c49b,
            #333
        );
}

.story:nth-child(4)
.story-bg{
    background:
        linear-gradient(
            145deg,
            #7b6a58,
            #b5c4ca,
            #202020
        );
}

.story:nth-child(5)
.story-bg{
    background:
        linear-gradient(
            145deg,
            #888,
            #333,
            #aaa
        );
}

.story::after{
    content:"";

    position:absolute;

    left:0;
    right:0;
    bottom:0;

    height:58%;

    background:
        linear-gradient(
            transparent,
            rgba(0,0,0,.85)
        );
}

.story-avatar{
    position:absolute;

    top:9px;
    left:9px;

    z-index:3;

    width:42px;
    height:42px;

    border-radius:50%;

    border:
        3px solid var(--blue);

    background:#fff;

    display:flex;
    align-items:center;
    justify-content:center;
}

.story-avatar svg{
    width:25px;
    height:25px;

    color:#777;
}

.story-name{
    position:absolute;

    left:9px;
    right:7px;
    bottom:10px;

    z-index:4;

    color:#fff;

    font-size:13px;

    font-weight:700;
}


/* CREATE STORY */

.create .story-bg{
    height:116px;

    bottom:auto;
}

.create::after{
    display:none;
}

.plus{
    position:absolute;

    z-index:4;

    top:94px;
    left:50%;

    transform:
        translateX(-50%);

    width:45px;
    height:45px;

    border-radius:50%;

    border:
        4px solid #fff;

    background:
        var(--blue);

    color:#fff;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:29px;
}

.create .story-name{
    color:#222;

    text-align:center;

    left:0;
    right:0;
}


/* =====================================================
   FEED
===================================================== */

.feed{
    padding-top:8px;

    background:
        var(--bg);
}

.post{
    background:#fff;

    margin-bottom:8px;

    border-bottom:
        1px solid var(--line);
}


/* POST HEADER */

.post-head{
    display:flex;

    justify-content:space-between;
    align-items:center;

    padding:
        12px 13px
        0;
}

.person{
    display:flex;

    align-items:center;

    gap:9px;
}

.post-avatar{
    width:44px;
    height:44px;

    border-radius:50%;

    background:#e4e6eb;

    color:#777;

    display:flex;
    align-items:center;
    justify-content:center;
}

.post-avatar svg{
    width:25px;
    height:25px;
}

.name{
    font-size:16px;

    font-weight:700;
}

.verified{
    display:inline-flex;

    width:17px;
    height:17px;

    border-radius:50%;

    align-items:center;
    justify-content:center;

    background:
        var(--blue);

    color:#fff;

    font-size:10px;
}

.meta{
    color:var(--muted);

    font-size:12px;

    margin-top:3px;
}

.more{
    font-size:25px;

    color:#65676b;

    padding:5px;
}


/* POST TEXT */

.text{
    padding:
        12px 13px;

    font-size:17px;

    line-height:1.5;
}


/* POST IMAGE */

.media{
    width:100%;
    height:360px;

    background:
        linear-gradient(
            145deg,
            #737b75,
            #c3c3b8,
            #5d635e
        );

    display:flex;
    align-items:center;
    justify-content:center;

    color:#fff;
}

.media svg{
    width:80px;
    height:80px;
}


/* POST STATS */

.stats{
    height:42px;

    margin:
        0 13px;

    border-bottom:
        1px solid var(--line);

    display:flex;

    align-items:center;

    justify-content:space-between;

    color:var(--muted);

    font-size:13px;
}

.reactions{
    display:flex;
    align-items:center;
}

.reaction{
    width:21px;
    height:21px;

    border-radius:50%;

    border:
        1px solid #fff;

    display:flex;

    align-items:center;
    justify-content:center;

    margin-left:-3px;

    font-size:11px;
}

.reaction:first-child{
    margin-left:0;
}

.like{
    background:#1877f2;
    color:#fff;
}

.love{
    background:#f33;
    color:#fff;
}

.haha{
    background:#ffd23f;
}


/* POST ACTIONS */

.actions{
    height:45px;

    display:grid;

    grid-template-columns:
        repeat(3,1fr);
}

.action{
    display:flex;

    align-items:center;
    justify-content:center;

    gap:6px;

    color:#65676b;

    font-size:14px;

    font-weight:700;
}

.action:active{
    background:#f2f2f2;
}


/* =====================================================
   MOBILE BOTTOM NAV
===================================================== */

.bottom{
    display:none;
}

@media(max-width:760px){

    body{
        padding-bottom:62px;

        background:#fff;
    }

    .bottom{
        position:fixed;

        left:0;
        right:0;
        bottom:0;

        z-index:2000;

        height:62px;

        background:#fff;

        border-top:
            1px solid var(--line);

        display:grid;

        grid-template-columns:
            repeat(5,1fr);
    }

    .bottom-item{
        display:flex;

        align-items:center;
        justify-content:center;

        color:#65676b;

        position:relative;

        font-size:24px;
    }

    .bottom-item svg{
        width:25px;
        height:25px;
    }

    .bottom-item.active{
        color:var(--blue);
    }

    .bottom-item.active::after{
        content:"";

        position:absolute;

        bottom:0;

        width:38px;
        height:3px;

        background:
            var(--blue);
    }
}


/* =====================================================
   SMALL PHONE
===================================================== */

@media(max-width:380px){

    .logo{
        font-size:30px;
    }

    .round{
        width:40px;
        height:40px;
    }

    .status{
        font-size:14px;

        padding:
            0 13px;
    }

    .story{
        width:104px;
        min-width:104px;
    }
}

</style>
</head>
