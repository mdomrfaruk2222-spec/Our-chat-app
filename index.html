<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Our Chat App</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; margin: 0; padding: 0; background: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; }
    .chat-container { width: 100%; max-width: 420px; height: 100vh; max-height: 700px; background: #fff; display: flex; flex-direction: column; box-shadow: 0 8px 24px rgba(0,0,0,0.15); border-radius: 12px; overflow: hidden; }
    .chat-header { background: #fff; border-bottom: 1px solid #e5e5e5; padding: 15px; display: flex; justify-content: space-between; align-items: center; }
    .chat-header h3 { margin: 0; color: #050505; font-size: 18px; }
    .user-name-btn { font-size: 13px; background: #e4e6eb; border: none; padding: 6px 12px; border-radius: 15px; cursor: pointer; font-weight: 600; }
    .messages { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; background: #fff; }
    .msg-group { display: flex; flex-direction: column; max-width: 75%; }
    .msg-group.my { align-self: flex-end; align-items: flex-end; }
    .msg-group.other { align-self: flex-start; align-items: flex-start; }
    .sender-name { font-size: 11px; color: #65676b; margin-bottom: 3px; padding: 0 4px; }
    .msg { padding: 10px 14px; border-radius: 18px; font-size: 15px; word-break: break-word; line-height: 1.4; }
    .my .msg { background: #0084ff; color: white; border-bottom-right-radius: 4px; }
    .other .msg { background: #f0f0f0; color: #050505; border-bottom-left-radius: 4px; }
    .msg-time { font-size: 10px; color: #bcc0c4; margin-top: 3px; padding: 0 4px; }
    .input-box { padding: 10px; border-top: 1px solid #e5e5e5; display: flex; gap: 8px; background: #fff; }
    input { flex: 1; padding: 12px 16px; border: 1px solid #e4e6eb; background: #f0f2f5; border-radius: 20px; outline: none; font-size: 15px; }
    button { padding: 0 18px; background: #0084ff; color: white; border: none; border-radius: 20px; cursor: pointer; font-weight: bold; font-size: 14px; }
  </style>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

<div class="chat-container">
  <div class="chat-header">
    <h3>Our Chat App</h3>
    <button class="user-name-btn" onclick="changeName()" id="nameDisplay">নাম সেট করুন</button>
  </div>
  <div class="messages" id="messageBox"></div>
  <div class="input-box">
    <input type="text" id="userInput" placeholder="Aa" onkeypress="if(event.key==='Enter') sendMessage()">
    <button onclick="sendMessage()">Send</button>
  </div>
</div>

<script>
  const firebaseConfig = {
    databaseURL: "https://my-chat-app-23ce7-default-rtdb.asia-southeast1.firebasedatabase.app/"
  };
  
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database().ref("messages");

  let myId = localStorage.getItem("chat_user_id");
  if (!myId) {
    myId = "user_" + Math.random().toString(36).substr(2, 9);
    localStorage.setItem("chat_user_id", myId);
  }

  let userName = localStorage.getItem("chat_user_name");
  if (!userName) {
    userName = prompt("আপনার নাম লিখুন:") || "User";
    localStorage.setItem("chat_user_name", userName);
  }
  document.getElementById("nameDisplay").innerText = userName;

  function changeName() {
    let newName = prompt("নতুন নাম লিখুন:", userName);
    if (newName && newName.trim() !== "") {
      userName = newName.trim();
      localStorage.setItem("chat_user_name", userName);
      document.getElementById("nameDisplay").innerText = userName;
    }
  }

  function sendMessage() {
    let input = document.getElementById("userInput");
    let text = input.value.trim();
    if(text !== "") {
      let time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      db.push({
        senderId: myId,
        senderName: userName,
        text: text,
        time: time
      });
      input.value = "";
    }
  }

  db.on("child_added", (snapshot) => {
    let msgData = snapshot.val();
    let msgBox = document.getElementById("messageBox");
    
    let group = document.createElement("div");
    group.classList.add("msg-group");
    
    let isMe = msgData.senderId === myId;
    group.classList.add(isMe ? "my" : "other");

    let nameDiv = document.createElement("div");
    nameDiv.classList.add("sender-name");
    nameDiv.innerText = isMe ? "You" : (msgData.senderName || "Friend");

    let msgDiv = document.createElement("div");
    msgDiv.classList.add("msg");
    msgDiv.innerText = msgData.text;

    let timeDiv = document.createElement("div");
    timeDiv.classList.add("msg-time");
    timeDiv.innerText = msgData.time || "";

    group.appendChild(nameDiv);
    group.appendChild(msgDiv);
    group.appendChild(timeDiv);
    
    msgBox.appendChild(group);
    msgBox.scrollTop = msgBox.scrollHeight;
  });
</script>

</body>
</html>
