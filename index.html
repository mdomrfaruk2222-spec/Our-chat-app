<script>

/* =========================
   COMMENT + SHARE + STORY
   WORKING VERSION
========================= */

function renderPosts(){

  const feed=document.getElementById("feed");

  if(!posts.length){

    feed.innerHTML=`
      <div style="
        background:#fff;
        padding:30px;
        text-align:center;
        color:#65676b;
      ">
        এখনো কোনো পোস্ট নেই।
      </div>
    `;

    return;
  }

  feed.innerHTML=posts.map(post=>{

    const counts=post.reactionCounts||{
      like:0,love:0,care:0,haha:0,wow:0,sad:0,angry:0
    };

    const users=post.reactionUsers||[];

    const total=Object.values(counts)
      .reduce((a,b)=>a+b,0);

    const icons=Object.keys(counts)
      .filter(k=>counts[k]>0)
      .slice(0,3)
      .map(k=>`
        <span class="reactionIcon">
          ${REACTIONS[k]}
        </span>
      `)
      .join("");

    const comments=post.comments||[];

    return `

      <article class="post">

        <div class="postHead">

          <div class="user">

            <div class="userAvatar">
              👤
            </div>

            <div>

              <div class="userName">
                আপনার নাম
              </div>

              <div class="time">
                ${safe(post.time||"এইমাত্র")} · 🌐
              </div>

            </div>

          </div>

          <button class="menu">
            ⋯
          </button>

        </div>


        ${
          post.text
          ?
          `<div class="postText">
            ${safe(post.text)}
          </div>`
          :
          ""
        }


        ${
          post.image
          ?
          `<img
            class="postImage"
            src="${post.image}"
            alt="Post image"
          >`
          :
          ""
        }


        <!-- REACTION STATS -->

        ${
          total>0
          ?
          `
          <div class="stats">

            <div
              class="reactionStats"
              onclick="showReactionUsers(
                posts.find(p=>p.id===${post.id})
              )"
            >

              <div class="reactionIcons">
                ${icons}
              </div>

              <span class="reactionTotal">
                ${total}
              </span>

            </div>

            <div>
              ${(comments.length||0)} মন্তব্য
              ·
              ${(post.shares||0)} শেয়ার
            </div>

          </div>
          `
          :
          `
          <div class="stats">

            <div></div>

            <div>
              ${(comments.length||0)} মন্তব্য
              ·
              ${(post.shares||0)} শেয়ার
            </div>

          </div>
          `
        }


        <!-- ACTIONS -->

        <div class="actions">


          <!-- REACTION -->

          <div class="reactionWrap">

            <button
              class="likeBtn ${
                post.reaction
                ? "liked"
                : ""
              }"
              onclick="
                toggleReactionBar(${post.id})
              "
              oncontextmenu="
                event.preventDefault();
                toggleReactionBar(${post.id});
              "
            >

              ${
                post.reaction
                ?
                REACTIONS[post.reaction]
                :
                "👍"
              }

              ${
                post.reaction
                ?
                REACTION_NAMES[post.reaction]
                :
                "লাইক"
              }

            </button>


            <div
              id="reactionBar-${post.id}"
              class="reactionBar"
              style="display:none"
            >

              ${
                Object.keys(REACTIONS)
                .map(type=>`

                  <button
                    onclick="
                      setReaction(
                        posts.find(p=>p.id===${post.id}),
                        '${type}'
                      );
                      event.stopPropagation();
                    "
                    title="${REACTION_NAMES[type]}"
                  >
                    ${REACTIONS[type]}
                  </button>

                `)
                .join("")
              }

            </div>

          </div>


          <!-- COMMENT -->

          <button
            onclick="
              focusComment(${post.id})
            "
          >
            💬 মন্তব্য
          </button>


          <!-- SHARE -->

          <button
            onclick="
              sharePost(${post.id})
            "
          >
            ↗️ শেয়ার
          </button>


        </div>


        <!-- COMMENTS -->

        <div class="comments">

          ${
            comments.map((comment,index)=>`

              <div class="comment">

                <b>
                  ${safe(comment.name||"আপনি")}
                </b>

                <br>

                ${safe(comment.text)}

              </div>

            `).join("")
          }


          <div class="commentBox">

            <input
              id="comment-${post.id}"
              type="text"
              placeholder="মন্তব্য লিখুন..."
              onkeydown="
                if(event.key==='Enter'){
                  addComment(${post.id});
                }
              "
            >

            <button
              onclick="
                addComment(${post.id})
              "
            >
              ➤
            </button>

          </div>

        </div>

      </article>

    `;

  }).join("");

}


/* =========================
   REACTION BAR
========================= */

function toggleReactionBar(id){

  document
    .querySelectorAll(".reactionBar")
    .forEach(bar=>{

      if(bar.id!=="reactionBar-"+id){

        bar.style.display="none";

      }

    });


  const bar=
    document.getElementById(
      "reactionBar-"+id
    );

  if(!bar)return;

  bar.style.display=
    bar.style.display==="none"
    ?
    "flex"
    :
    "none";

}


/* =========================
   CLOSE REACTION BAR
========================= */

document.addEventListener(
  "click",
  function(e){

    if(
      !e.target.closest(".reactionWrap")
    ){

      document
        .querySelectorAll(".reactionBar")
        .forEach(bar=>{
          bar.style.display="none";
        });

    }

  }
);


/* =========================
   ADD COMMENT
========================= */

function addComment(id){

  const post=
    posts.find(p=>p.id===id);

  if(!post)return;


  if(!post.comments){

    post.comments=[];

  }


  const input=
    document.getElementById(
      "comment-"+id
    );

  if(!input)return;


  const text=input.value.trim();

  if(!text)return;


  post.comments.push({

    id:Date.now(),

    name:"আপনি",

    text:text,

    time:"এইমাত্র"

  });


  savePosts();

  renderPosts();


  setTimeout(()=>{

    focusComment(id);

  },100);

}


/* =========================
   FOCUS COMMENT
========================= */

function focusComment(id){

  const input=
    document.getElementById(
      "comment-"+id
    );

  if(input){

    input.focus();

    input.scrollIntoView({
      behavior:"smooth",
      block:"center"
    });

  }

}


/* =========================
   SHARE
========================= */

function sharePost(id){

  const post=
    posts.find(p=>p.id===id);

  if(!post)return;


  post.shares=
    (post.shares||0)+1;


  savePosts();

  renderPosts();


  if(
    navigator.share
  ){

    navigator.share({

      title:"MySocial পোস্ট",

      text:
        post.text||
        "MySocial থেকে একটি পোস্ট"

    }).catch(()=>{});

  }

  else{

    alert(
      "পোস্ট শেয়ার হয়েছে ✅"
    );

  }

}


/* =========================
   REACTION USERS MODAL
========================= */

function showReactionUsers(post){

  if(!post)return;


  const users=
    post.reactionUsers||[];


  const modal=
    document.createElement("div");

  modal.className=
    "reactionModal";


  modal.innerHTML=`

    <div class="reactionListBox">

      <div class="reactionListHead">

        <span>
          Reactions (${users.length})
        </span>

        <button
          class="reactionClose"
          id="reactionCloseBtn"
        >
          ✕
        </button>

      </div>


      ${
        users.length
        ?

        users.map(user=>`

          <div class="reactionPerson">

            <div class="reactionPersonAvatar">
              👤
            </div>

            <div class="reactionPersonName">

              ${safe(user.name)}

              <div style="
                font-size:12px;
                color:#65676b;
                font-weight:normal
              ">
                ${REACTION_NAMES[user.reaction]}
              </div>

            </div>

            <div class="reactionPersonType">
              ${REACTIONS[user.reaction]}
            </div>

          </div>

        `).join("")

        :

        `
        <div style="
          padding:35px;
          text-align:center;
          color:#65676b;
        ">
          এখনো কেউ Reaction দেয়নি।
        </div>
        `
      }

    </div>

  `;


  document.body.appendChild(modal);


  document
    .getElementById("reactionCloseBtn")
    .onclick=()=>{
      modal.remove();
    };


  modal.onclick=e=>{

    if(e.target===modal){

      modal.remove();

    }

  };

}


/* =========================
   CREATE STORY
========================= */

let selectedStoryImage=null;


document
  .getElementById("createStory")
  .onclick=openStory;


function openStory(){

  selectedStoryImage=null;


  const modal=
    document.createElement("div");

  modal.className="modalBg";


  modal.innerHTML=`

    <div class="modal">

      <div class="modalHead">

        <h2>
          স্টোরি তৈরি করুন
        </h2>

        <button
          class="close"
          id="storyClose"
        >
          ✕
        </button>

      </div>


      <div class="modalUser">

        <div class="modalAvatar">
          👤
        </div>

        <div>

          <b>
            আপনার স্টোরি
          </b>

          <div style="
            font-size:12px;
            color:#65676b
          ">
            ২৪ ঘণ্টা দেখা যাবে
          </div>

        </div>

      </div>


      <textarea
        id="storyText"
        placeholder="স্টোরিতে কিছু লিখুন..."
      ></textarea>


      <div
        class="preview"
        id="storyPreview"
      ></div>


      <div class="options">

        <label class="option">

          🖼️ ছবি যোগ করুন

          <input
            type="file"
            id="storyImage"
            accept="image/*"
            hidden
          >

        </label>

      </div>


      <button
        class="publish"
        id="publishStory"
      >
        স্টোরিতে যোগ করুন
      </button>

    </div>

  `;


  document.body.appendChild(modal);


  document
    .getElementById("storyClose")
    .onclick=()=>{
      modal.remove();
    };


  document
    .getElementById("storyImage")
    .onchange=handleStoryImage;


  document
    .getElementById("publishStory")
    .onclick=createStory;

}


/* =========================
   STORY IMAGE
========================= */

function handleStoryImage(e){

  const file=e.target.files[0];

  if(!file)return;


  const reader=
    new FileReader();


  reader.onload=()=>{

    selectedStoryImage=
      reader.result;


    document
      .getElementById("storyPreview")
      .innerHTML=`

        <img
          src="${selectedStoryImage}"
        >

      `;

  };


  reader.readAsDataURL(file);

}


/* =========================
   CREATE STORY
========================= */

function createStory(){

  const text=
    document
      .getElementById("storyText")
      .value
      .trim();


  if(!text&&!selectedStoryImage){

    alert(
      "স্টোরিতে লেখা অথবা ছবি দিন।"
    );

    return;

  }


  stories.unshift({

    id:Date.now(),

    text:text,

    image:selectedStoryImage,

    name:"আপনি",

    time:"এইমাত্র"

  });


  saveStories();


  const modal=
    document.querySelector(".modalBg");

  if(modal){

    modal.remove();

  }


  selectedStoryImage=null;


  renderStories();

}


/* =========================
   RENDER STORIES
========================= */

function renderStories(){

  const list=
    document.getElementById(
      "storyList"
    );


  const myStories=
    stories||[];


  list.innerHTML=`

    <div
      class="story createStory"
      id="createStory"
    >

      <div class="createImage"></div>

      <button class="plus">
        +
      </button>

      <div class="storyName">
        স্টোরি তৈরি করুন
      </div>

    </div>


    ${
      myStories.map(story=>`

        <div
          class="story"
          onclick="
            openStoryViewer(
              ${story.id}
            )
          "
          style="
            background-image:
              ${
                story.image
                ?
                `url('${story.image}')`
                :
                "linear-gradient(145deg,#1877f2,#111)"
              };
            background-size:cover;
            background-position:center;
          "
        >

          <div class="storyAvatar">
            👤
          </div>

          <div class="storyName">
            ${safe(story.name||"আপনি")}
          </div>

        </div>

      `).join("")
    }

  `;


  document
    .getElementById("createStory")
    .onclick=openStory;

}


/* =========================
   STORY VIEWER
========================= */

function openStoryViewer(id){

  const story=
    stories.find(s=>s.id===id);

  if(!story)return;


  const viewer=
    document.createElement("div");

  viewer.className=
    "storyViewer";


  viewer.innerHTML=`

    <div class="viewerBox">

      <div class="viewerTop">

        <div class="viewerUser">
          ${safe(story.name)}
          <div style="
            font-size:11px;
            font-weight:normal
          ">
            ${safe(story.time)}
          </div>
        </div>


        <button
          class="viewerDelete"
          onclick="
            deleteStory(${story.id})
          "
        >
          🗑️
        </button>


        <button
          class="viewerClose"
          onclick="
            this.closest('.storyViewer').remove()
          "
        >
          ✕
        </button>

      </div>


      ${
        story.image
        ?
        `
        <img
          class="viewerImage"
          src="${story.image}"
        >
        `
        :
        ""
      }


      ${
        story.text
        ?
        `
        <div class="viewerText">
          ${safe(story.text)}
        </div>
        `
        :
        ""
      }

    </div>

  `;


  document.body.appendChild(viewer);

}


/* =========================
   DELETE STORY
========================= */

function deleteStory(id){

  if(
    !confirm(
      "এই স্টোরিটি মুছে ফেলবেন?"
    )
  )return;


  stories=
    stories.filter(
      story=>story.id!==id
    );


  saveStories();

  renderStories();


  const viewer=
    document.querySelector(
      ".storyViewer"
    );

  if(viewer){

    viewer.remove();

  }

}


/* =========================
   INITIALIZE
========================= */

preparePosts();

renderPosts();

renderStories();


    </script>
