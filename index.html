<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Our Chat App</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background: #f4f4f9; }
    .chat-container { max-width: 400px; margin: 0 auto; background: #fff; padding: 15px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
    .messages { height: 300px; overflow-y: auto; border: 1px solid #ddd; padding: 10px; margin-bottom: 10px; border-radius: 5px; }
    .input-box { display: flex; gap: 5px; }
    input { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 5px; }
    button { padding: 10px 15px; background: #28a745; color: white; border: none; border-radius: 5px; cursor: pointer; }
  </style>
</head>
<body>

<div class="chat-container">
  <h2>Our Chat App</h2>
  <div class="messages" id="messageBox">
    <p><b>System:</b> চ্যাট অ্যাপে স্বাগতম!</p>
  </div>
  <div class="input-box">
    <input type="text" id="userInput" placeholder="মেসেজ লিখুন...">
    <button onclick="sendMessage()">Send</button>
  </div>
</div>

<script>
  function sendMessage() {
    let input = document.getElementById("userInput");
    let msgBox = document.getElementById("messageBox");
    if(input.value.trim() !== "") {
      msgBox.innerHTML += `<p><b>You:</b> ${input.value}</p>`;
      input.value = "";
      msgBox.scrollTop = msgBox.scrollHeight;
    }
  }
</script>

</body>
</html>
