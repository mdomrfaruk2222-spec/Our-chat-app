<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Our Chat App</title>
  <style>
    * { box-sizing: border-box; }
    :root {
      --bg-color: #f0f2f5;
      --card-bg: #ffffff;
      --text-color: #050505;
      --border-color: #e5e5e5;
      --other-msg-bg: #f0f0f0;
    }
    body.dark {
      --bg-color: #18191a;
      --card-bg: #242526;
      --text-color: #e4e6eb;
      --border-color: #3e4042;
      --other-msg-bg: #3a3b3c;
    }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 0; background: var(--bg-color); display: flex; justify-content: center; align-items: center; height: 100vh; transition: 0.3s; }
    .chat-container { width: 100%; max-width: 420px; height: 100vh; max-height: 700px; background: var(--card-bg); display: flex; flex-direction: column; box-shadow: 0 8px 24px rgba(0,0,0,0.15); border-radius: 12px; overflow: hidden; color: var(--text-color); }
    .chat-header { background: var(--card-bg); border-bottom: 1px solid var(--border-color); padding: 12px 15px; display: flex; justify-content: space-between; align-items: center; }
    .header-info { display: flex; align-items: center; gap: 8px; }
    .online-dot { width: 10px; height: 10px; background: #31a24c; border-radius: 50%; display: inline-block; }
    .chat-header h3 { margin: 0; font-size: 18px; }
    .header-btns { display: flex; gap: 6px; }
    .btn { font-size: 13px; background: var(--border-color); border: none; padding: 6px 10px; border-radius: 15px; cursor: pointer; color: var(--text-color); font-weight: 600; }
    .messages { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; background: var(--card-bg); }
    .msg-group { display: flex; flex-direction: column; max-width: 75%; }
    .msg-group.my { align-self: flex-end; align-items: flex-end; }
    .msg-group.other { align-self: flex-start; align-items: flex-start; }
    .sender-name { font-size: 11px; color: #8a8d91; margin-bottom: 3px; padding: 0 4px; }
    .msg { padding: 10px 14px; border-radius: 18px; font-size: 15px; word-break: break-word; line-height: 1.4; }
    .my .msg { background: #0084ff; color: white; border-bottom-right-radius: 4px; }
    .other .msg { background: var(--other-msg-bg); color: var(--text-color); border-bottom-left-radius: 4px; }
    .like-msg { font-size: 32px; background: transparent !important; padding: 0 !important; }
    .chat-img { max-width: 100%; border-radius: 12px; margin-top: 5px; }
    .msg-time { font-size: 10px; color: #8a8d91; margin-top: 3px; padding: 0 4px; }
    .input-box { padding: 10px; border-top: 1px solid var(--border-color); display: flex; gap: 8px; background: var(--card-bg); align-items: center; }
    .icon-btn { background: var(--border-color); border: none; font-size: 18px; padding: 8px 10px; border-radius: 50%; cursor: pointer; color: var(--text-color); display: flex; align-items: center; justify-content: center; }
    input[type="text"] { flex: 1; padding: 10px 14px; border: 1px solid var(--border-color); background: var(--bg-color); color: var(--text-color); border-radius: 20px; outline: none; font-size: 15px; }
  </style>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

<div class="chat-container">
  <div class="chat-header">
    <div class="header-info">
      <span class="online-dot"></span>
      <h3>Our Chat</h3>
    </div>
    <div class="header-btns">
      <button class="btn" onclick="toggleDarkMode()">🌙</button>
      <button class="btn" onclick="changeName()" id="nameDisplay">নাম</button>
    </div>
  </div>
  <div class="messages" id="messageBox"></div>
  <div class="input-box">
    <label class="icon-btn" for="imgInput">📷</label>
    <input type="file" id="imgInput" accept="image/*" style="display:none" onchange="sendImage(this)">
    <input type="text" id="userInput" placeholder="Aa" oninput="toggleSendBtn()" onkeypress="if(event.key==='Enter') sendMessage()">
    <button class="icon-btn" id="actionBtn" onclick="handleAction()">👍</button>
  </div>
</div>

<script>
  const firebaseConfig = {
    databaseURL: "https://my-chat-app-23ce7-default-rtdb.asia-southeast1.firebasedatabase.app/"
  };
  
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database().ref("messages");
  const msgSound = new Audio('https://assets.mixkit.co/active_storage/sfx/2354/2354-preview.mp3');

  let myId = localStorage.getItem("chat_user_id") || "user_" + Math.random().toString(36).substr(2, 9);
  localStorage.setItem("chat_user_id", myId);

  let userName = localStorage.getItem("chat_user_name") || prompt("আপনার নাম লিখুন:") || "User";
  localStorage.setItem("chat_user_name", userName);
  document.getElementById("nameDisplay").innerText = userName;

  function toggleDarkMode() {
    document.body.classList.toggle("dark");
  }

  function changeName() {
    let newName = prompt("নতুন নাম লিখুন:", userName);
    if (newName && newName.trim() !== "") {
      userName = newName.trim();
      localStorage.setItem("chat_user_name", userName);
      document.getElementById("nameDisplay").innerText = userName;
    }
  }

  function toggleSendBtn() {
    let input = document.getElementById("userInput");
    let btn = document.getElementById("actionBtn");
    btn.innerText = input.value.trim() !== "" ? "🚀" : "👍";
  }

  function handleAction() {
    let input = document.getElementById("userInput");
    let text = input.value.trim();
    if (text !== "") {
      sendMessage();
    } else {
      sendLike();
    }
  }

  function sendMessage() {
    let input = document.getElementById("userInput");
    let text = input.value.trim();
    if(text !== "") {
      let time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      db.push({ senderId: myId, senderName: userName, text: text, time: time });
      input.value = "";
      toggleSendBtn();
    }
  }

  function sendLike() {
    let time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    db.push({ senderId: myId, senderName: userName, text: "👍", isLike: true, time: time });
  }

  function sendImage(fileInput) {
    const file = fileInput.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = function(e) {
        let time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        db.push({ senderId: myId, senderName: userName, image: e.target.result, time: time });
      };
      reader.readAsDataURL(file);
      fileInput.value = "";
    }
  }

  let isFirstLoad = true;

  db.on("child_added", (snapshot) => {
    let msgData = snapshot.val();
    let msgBox = document.getElementById("messageBox");
    let group = document.createElement("div");
    group.classList.add("msg-group");
    
    let isMe = msgData.senderId === myId;
    group.classList.add(isMe ? "my" : "other");

    let nameDiv = document.createElement("div");
    nameDiv.classList.add("sender-name");
    nameDiv.innerText = isMe ? "You" : (msgData.senderName || "Friend");
    group.appendChild(nameDiv);

    if (msgData.text) {
      let msgDiv = document.createElement("div");
      msgDiv.classList.add("msg");
      if(msgData.isLike) msgDiv.classList.add("like-msg");
      msgDiv.innerText = msgData.text;
      group.appendChild(msgDiv);
    }

    if (msgData.image) {
      let img = document.createElement("img");
      img.src = msgData.image;
      img.classList.add("chat-img");
      group.appendChild(img);
    }

    let timeDiv = document.createElement("div");
    timeDiv.classList.add("msg-time");
    timeDiv.innerText = msgData.time || "";
    group.appendChild(timeDiv);
    
    msgBox.appendChild(group);
    msgBox.scrollTop = msgBox.scrollHeight;

    if (!isMe && !isFirstLoad) {
      msgSound.play().catch(() => {});
    }
  });

  db.once("value", () => { isFirstLoad = false; });
</script>

</body>
</html>
