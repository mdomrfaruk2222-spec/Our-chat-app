<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Facebook Clone</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 0; background: #18191a; color: #e4e6eb; display: flex; justify-content: center; align-items: center; height: 100vh; }
    .app-container { width: 100%; max-width: 420px; height: 100vh; max-height: 800px; background: #242526; display: flex; flex-direction: column; box-shadow: 0 8px 24px rgba(0,0,0,0.5); border-radius: 12px; overflow: hidden; position: relative; }
    
    /* Login Screen */
    #loginScreen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #18191a; z-index: 100; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; }
    .login-box { width: 100%; max-width: 320px; display: flex; flex-direction: column; gap: 15px; }
    .login-box h2 { color: #2d88ff; text-align: center; font-size: 32px; margin-bottom: 10px; }
    .login-input { padding: 12px 15px; background: #3a3b3c; border: 1px solid #3e4042; border-radius: 8px; color: white; font-size: 16px; outline: none; }
    .login-btn { padding: 12px; background: #2d88ff; border: none; border-radius: 8px; color: white; font-size: 16px; font-weight: bold; cursor: pointer; }

    /* Facebook Header */
    .fb-header { background: #242526; padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #3e4042; }
    .fb-logo { color: #2d88ff; font-size: 26px; font-weight: bold; font-family: sans-serif; }
    .fb-header-icons { display: flex; gap: 8px; }
    .fb-icon-btn { background: #3a3b3c; border: none; width: 36px; height: 36px; border-radius: 50%; display: flex; justify-content: center; align-items: center; cursor: pointer; color: white; font-size: 16px; }

    /* Main Scroll Area */
    .fb-content { flex: 1; overflow-y: auto; background: #18191a; display: flex; flex-direction: column; gap: 8px; }

    /* Create Post Box */
    .create-post-section { background: #242526; padding: 10px 15px; display: flex; flex-direction: column; gap: 10px; }
    .post-top { display: flex; gap: 10px; align-items: center; }
    .user-avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; }
    .post-input-fake { flex: 1; background: #3a3b3c; border: 20px; padding: 10px 15px; border-radius: 20px; color: #b0b3b8; font-size: 15px; cursor: pointer; }
    .post-actions { display: flex; justify-content: space-around; border-top: 1px solid #3e4042; padding-top: 8px; }
    .post-action-btn { background: none; border: none; color: #b0b3b8; font-size: 14px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px; }

    /* Stories Section */
    .stories-container { display: flex; gap: 8px; padding: 10px; background: #242526; overflow-x: auto; scrollbar-width: none; }
    .stories-container::-webkit-scrollbar { display: none; }
    .story-card { min-width: 100px; height: 160px; border-radius: 12px; background: #3a3b3c; position: relative; overflow: hidden; cursor: pointer; display: flex; flex-direction: column; justify-content: space-between; padding: 8px; border: 1px solid #3e4042; }
    .story-card img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; }
    .story-avatar { width: 32px; height: 32px; border-radius: 50%; border: 2px solid #2d88ff; object-fit: cover; position: relative; z-index: 2; }
    .story-name { font-size: 11px; color: white; font-weight: bold; position: relative; z-index: 2; text-shadow: 0 1px 2px black; }

    /* News Feed Posts */
    .post-card { background: #242526; padding: 12px 15px; display: flex; flex-direction: column; gap: 10px; }
    .post-header { display: flex; justify-content: space-between; align-items: center; }
    .poster-info { display: flex; gap: 10px; align-items: center; }
    .poster-name { font-size: 15px; font-weight: bold; color: #e4e6eb; margin: 0; }
    .post-time { font-size: 11px; color: #b0b3b8; }
    .post-text { font-size: 15px; line-height: 1.4; margin: 0; word-break: break-word; }
    .post-media { width: 100%; max-height: 300px; border-radius: 8px; object-fit: cover; }

    /* Post Modal */
    #postModal { display: none; position: absolute; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.8); z-index: 200; justify-content: center; align-items: center; padding: 20px; }
    .modal-content { background: #242526; width: 100%; max-width: 380px; padding: 20px; border-radius: 12px; display: flex; flex-direction: column; gap: 15px; }
    .modal-content textarea { width: 100%; height: 100px; background: #3a3b3c; border: none; border-radius: 8px; color: white; padding: 10px; resize: none; outline: none; font-size: 15px; }
  </style>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

<div class="app-container">
  
  <!-- LOGIN SCREEN -->
  <div id="loginScreen">
    <div class="login-box">
      <h2>facebook</h2>
      <input type="text" id="loginName" class="login-input" placeholder="আপনার নাম লিখুন">
      <input type="text" id="loginContact" class="login-input" placeholder="মোবাইল নম্বর বা জিমেইল">
      <button class="login-btn" onclick="handleLogin()">লগইন করুন</button>
    </div>
  </div>

  <!-- MAIN FACEBOOK UI -->
  <div class="fb-header">
    <div class="fb-logo">facebook</div>
    <div class="fb-header-icons">
      <button class="fb-icon-btn" onclick="alert('সার্চ ফিচার')">🔍</button>
      <button class="fb-icon-btn" onclick="logout()">🚪</button>
    </div>
  </div>

  <div class="fb-content">
    
    <!-- Create Post Section -->
    <div class="create-post-section">
      <div class="post-top">
        <img id="myHeaderAvatar" class="user-avatar" src="https://i.ibb.co/m5vXzVJ/user.png">
        <div class="post-input-fake" onclick="openPostModal()">মনে কি চলছে?</div>
      </div>
      <div class="post-actions">
        <button class="post-action-btn" onclick="openPostModal()">📷 ছবি/ভিডিও</button>
        <button class="post-action-btn" onclick="uploadStoryPrompt()">➕ স্টোরি</button>
      </div>
    </div>

    <!-- Stories Bar -->
    <div class="stories-container" id="storiesContainer">
      <!-- Stories will load here -->
    </div>

    <!-- News Feed (Posts) -->
    <div id="newsFeed" style="display: flex; flex-direction: column; gap: 8px;">
      <!-- Posts will load here -->
    </div>

  </div>

  <!-- POST CREATION MODAL -->
  <div id="postModal">
    <div class="modal-content">
      <h3>পোস্ট তৈরি করুন</h3>
      <textarea id="postText" placeholder="আপনার মনের কথা লিখুন..."></textarea>
      <input type="file" id="postMediaInput" accept="image/*,video/*">
      <div style="display: flex; gap: 10px; justify-content: flex-end;">
        <button class="login-btn" style="background: #3a3b3c;" onclick="closePostModal()">বাতিল</button>
        <button class="login-btn" onclick="submitPost()">পোস্ট করুন</button>
      </div>
    </div>
  </div>

  <input type="file" id="storyFileInput" accept="image/*" style="display:none" onchange="saveStory(this)">

</div>

<script>
  const firebaseConfig = { databaseURL: "https://my-chat-app-23ce7-default-rtdb.asia-southeast1.firebasedatabase.app/" };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();
  const postsRef = db.ref("posts");
  const usersRef = db.ref("users");
  const storiesRef = db.ref("stories");

  let currentUser = JSON.parse(localStorage.getItem("fb_user")) || null;

  if(currentUser) {
    document.getElementById("loginScreen").style.display = "none";
    document.getElementById("myHeaderAvatar").src = currentUser.pic;
    initApp();
  }

  function handleLogin() {
    let name = document.getElementById("loginName").value.trim();
    let contact = document.getElementById("loginContact").value.trim();
    if(!name || !contact) {
      alert("দয়া করে নাম এবং মোবাইল নম্বর/জিমেইল দিন!");
      return;
    }
    let userId = "user_" + Math.random().toString(36).substr(2, 9);
    currentUser = { id: userId, name: name, contact: contact, pic: "https://i.ibb.co/m5vXzVJ/user.png" };
    localStorage.setItem("fb_user", JSON.stringify(currentUser));
    
    usersRef.child(userId).set(currentUser);
    document.getElementById("loginScreen").style.display = "none";
    document.getElementById("myHeaderAvatar").src = currentUser.pic;
    initApp();
  }

  function logout() {
    localStorage.removeItem("fb_user");
    location.reload();
  }

  function initApp() {
    loadPosts();
    loadStories();
  }

  function openPostModal() { document.getElementById("postModal").style.display = "flex"; }
  function closePostModal() { document.getElementById("postModal").style.display = "none"; }

  function submitPost() {
    let text = document.getElementById("postText").value.trim();
    let fileInput = document.getElementById("postMediaInput");
    
    if(!text && fileInput.files.length === 0) {
      alert("কিছু লিখে বা ছবি দিয়ে পোস্ট করুন!");
      return;
    }

    if(fileInput.files.length > 0) {
      const reader = new FileReader();
      reader.onload = function(e) {
        savePostToDb(text, e.target.result);
      };
      reader.readAsDataURL(fileInput.files[0]);
    } else {
      savePostToDb(text, null);
    }
  }

  function savePostToDb(text, media) {
    postsRef.push({
      userId: currentUser.id,
      userName: currentUser.name,
      userPic: currentUser.pic,
      text: text,
      media: media,
      time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
    });
    document.getElementById("postText").value = "";
    document.getElementById("postMediaInput").value = "";
    closePostModal();
  }

  function loadPosts() {
    postsRef.on("value", snapshot => {
      let feed = document.getElementById("newsFeed");
      feed.innerHTML = "";
      let data = snapshot.val() || {};
      Object.keys(data).reverse().forEach(key => {
        let p = data[key];
        let mediaHtml = p.media ? `<img class="post-media" src="${p.media}">` : "";
        feed.innerHTML += `
          <div class="post-card">
            <div class="post-header">
              <div class="poster-info">
                <img class="user-avatar" src="${p.userPic || 'https://i.ibb.co/m5vXzVJ/user.png'}">
                <div>
                  <h4 class="poster-name">${p.userName}</h4>
                  <span class="post-time">${p.time}</span>
                </div>
              </div>
            </div>
            ${p.text ? `<p class="post-text">${p.text}</p>` : ""}
            ${mediaHtml}
          </div>
        `;
      });
    });
  }

  function uploadStoryPrompt() { document.getElementById("storyFileInput").click(); }
  function saveStory(input) {
    const file = input.files[0];
    if(file) {
      const reader = new FileReader();
      reader.onload = function(e) {
        storiesRef.push({
          userId: currentUser.id,
          userName: currentUser.name,
          userPic: currentUser.pic,
          storyImg: e.target.result
        });
        alert("স্টোরি সফলভাবে আপলোড হয়েছে!");
      };
      reader.readAsDataURL(file);
    }
  }

  function loadStories() {
    storiesRef.on("value", snapshot => {
      let container = document.getElementById("storiesContainer");
      container.innerHTML = `
        <div class="story-card" onclick="uploadStoryPrompt()">
          <img src="https://i.ibb.co/m5vXzVJ/user.png" style="opacity:0.6;">
          <div style="margin-top:auto; text-align:center; z-index:2; padding-bottom:10px;">
            <div style="background:#2d88ff; color:white; border-radius:50%; width:25px; height:25px; display:inline-flex; justify-content:center; align-items:center; font-weight:bold;">+</div>
            <div style="font-size:11px; font-weight:bold; margin-top:4px;">Create story</div>
          </div>
        </div>
      `;
      let data = snapshot.val() || {};
      Object.keys(data).forEach(key => {
        let s = data[key];
        container.innerHTML += `
          <div class="story-card">
            <img src="${s.storyImg}">
            <img class="story-avatar" src="${s.userPic || 'https://i.ibb.co/m5vXzVJ/user.png'}">
            <div class="story-name">${s.userName}</div>
          </div>
        `;
      });
    });
  }
</script>

</body>
</html>
